<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#4682B4"/>
    </radialGradient>
    <radialGradient id="grass" cx="50%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#228B22"/>
      <stop offset="100%" stop-color="#006400"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComponentTransfer in="blend">
        <feFuncA type="linear" slope="0.85"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="680" cy="80" r="60" fill="#FFD700" opacity="0.3"/>
  <circle cx="680" cy="80" r="35" fill="#FFF8DC" opacity="0.6"/>

  <!-- River -->
  <ellipse cx="400" cy="420" rx="500" ry="120" fill="#4169E1" opacity="0.6"/>
  <ellipse cx="400" cy="430" rx="480" ry="100" fill="#1E90FF" opacity="0.4"/>
  <!-- Water reflections -->
  <rect x="100" y="400" width="80" height="3" rx="1" fill="white" opacity="0.4"/>
  <rect x="250" y="415" width="120" height="2" rx="1" fill="white" opacity="0.3"/>
  <rect x="500" y="405" width="90" height="3" rx="1" fill="white" opacity="0.4"/>
  <rect x="620" y="420" width="60" height="2" rx="1" fill="white" opacity="0.3"/>

  <!-- Grass / ground -->
  <rect x="0" y="330" width="800" height="270" fill="url(#grass)"/>

  <!-- Light patches on grass (pointillist dots) -->
  <g opacity="0.7">
    <circle cx="80" cy="380" r="4" fill="#90EE90"/>
    <circle cx="90" cy="390" r="3" fill="#ADFF2F"/>
    <circle cx="120" cy="370" r="5" fill="#7CFC00"/>
    <circle cx="150" cy="385" r="4" fill="#90EE90"/>
    <circle cx="200" cy="375" r="3" fill="#ADFF2F"/>
    <circle cx="230" cy="390" r="4" fill="#98FB98"/>
    <circle cx="280" cy="365" r="5" fill="#7CFC00"/>
    <circle cx="320" cy="380" r="3" fill="#90EE90"/>
    <circle cx="380" cy="360" r="4" fill="#ADFF2F"/>
    <circle cx="450" cy="375" r="5" fill="#7CFC00"/>
    <circle cx="520" cy="370" r="3" fill="#90EE90"/>
    <circle cx="580" cy="385" r="4" fill="#98FB98"/>
    <circle cx="650" cy="360" r="5" fill="#ADFF2F"/>
    <circle cx="720" cy="375" r="3" fill="#7CFC00"/>
    <circle cx="760" cy="390" r="4" fill="#90EE90"/>
  </g>

  <!-- Tree trunk left -->
  <rect x="50" y="180" width="28" height="220" rx="4" fill="#4A2F1A"/>
  <!-- Tree foliage left -->
  <ellipse cx="64" cy="180" rx="70" ry="90" fill="#1A5C1A"/>
  <ellipse cx="40" cy="200" rx="45" ry="60" fill="#228B22"/>
  <ellipse cx="88" cy="195" rx="50" ry="65" fill="#196619"/>

  <!-- Tree trunk right -->
  <rect x="710" y="160" width="32" height="240" rx="4" fill="#4A2F1A"/>
  <!-- Tree foliage right -->
  <ellipse cx="726" cy="155" rx="80" ry="100" fill="#1A5C1A"/>
  <ellipse cx="700" cy="175" rx="50" ry="70" fill="#228B22"/>
  <ellipse cx="755" cy="170" rx="55" ry="75" fill="#196619"/>

  <!-- Background trees (middle) -->
  <rect x="340" y="240" width="16" height="130" rx="3" fill="#3D2009"/>
  <ellipse cx="348" cy="240" rx="40" ry="55" fill="#2E7D32"/>
  <rect x="460" y="255" width="14" height="120" rx="3" fill="#3D2009"/>
  <ellipse cx="467" cy="255" rx="35" ry="50" fill="#388E3C"/>

  <!-- Figure 1: woman with parasol (main, right side) -->
  <g transform="translate(530, 260)">
    <!-- Parasol -->
    <ellipse cx="0" cy="-40" rx="35" ry="20" fill="#D2691E" opacity="0.9"/>
    <line x1="0" y1="-20" x2="0" y2="10" stroke="#8B4513" stroke-width="2"/>
    <!-- Body/dress -->
    <ellipse cx="0" cy="30" rx="18" ry="35" fill="#C0C0C0"/>
    <!-- Head -->
    <circle cx="0" cy="-5" r="12" fill="#F5DEB3"/>
    <!-- Hat -->
    <ellipse cx="0" cy="-15" rx="16" ry="5" fill="#696969"/>
    <rect x="-8" y="-20" width="16" height="8" rx="3" fill="#696969"/>
  </g>

  <!-- Figure 2: child running -->
  <g transform="translate(390, 305)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="10" ry="18" fill="#DC143C"/>
    <!-- Head -->
    <circle cx="0" cy="-2" r="9" fill="#F5DEB3"/>
    <!-- Legs -->
    <line x1="-4" y1="35" x2="-8" y2="55" stroke="#8B0000" stroke-width="4" stroke-linecap="round"/>
    <line x1="4" y1="35" x2="10" y2="52" stroke="#8B0000" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Figure 3: sitting man with hat -->
  <g transform="translate(200, 330)">
    <!-- Body leaning -->
    <ellipse cx="0" cy="15" rx="20" ry="22" fill="#2F4F4F"/>
    <!-- Head -->
    <circle cx="5" cy="-8" r="11" fill="#DEB887"/>
    <!-- Top hat -->
    <ellipse cx="5" cy="-17" rx="14" ry="4" fill="#1C1C1C"/>
    <rect x="-6" y="-32" width="22" height="17" rx="2" fill="#1C1C1C"/>
    <!-- Cane -->
    <line x1="20" y1="0" x2="30" y2="40" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Figure 4: woman sitting with umbrella (far left) -->
  <g transform="translate(130, 340)">
    <ellipse cx="0" cy="20" rx="16" ry="22" fill="#4682B4"/>
    <circle cx="0" cy="-2" r="10" fill="#F5DEB3"/>
    <ellipse cx="0" cy="-10" rx="12" ry="4" fill="#6495ED"/>
    <!-- Umbrella closed -->
    <line x1="15" y1="-5" x2="28" y2="-35" stroke="#4169E1" stroke-width="2"/>
    <ellipse cx="28" cy="-38" rx="12" ry="6" fill="#6495ED" opacity="0.8"/>
  </g>

  <!-- Figure 5: standing couple far right -->
  <g transform="translate(650, 265)">
    <!-- Man -->
    <ellipse cx="0" cy="35" rx="12" ry="30" fill="#556B2F"/>
    <circle cx="0" cy="0" r="11" fill="#DEB887"/>
    <ellipse cx="0" cy="-9" rx="13" ry="4" fill="#3B3B3B"/>
    <rect x="-6" y="-20" width="12" height="13" rx="2" fill="#3B3B3B"/>
    <!-- Woman beside -->
    <ellipse cx="22" cy="38" rx="14" ry="28" fill="#8B008B"/>
    <circle cx="22" cy="5" r="10" fill="#F5DEB3"/>
    <ellipse cx="22" cy="-4" rx="12" ry="4" fill="#9400D3"/>
  </g>

  <!-- Monkey on leash (subtle detail, left side) -->
  <g transform="translate(160, 380)" opacity="0.8">
    <circle cx="0" cy="0" r="6" fill="#8B6914"/>
    <ellipse cx="0" cy="10" rx="5" ry="8" fill="#8B6914"/>
    <line x1="5" y1="5" x2="25" y2="20" stroke="#4A3000" stroke-width="1.5"/>
  </g>

  <!-- Pointillist dots overlay (Seurat style) -->
  <g opacity="0.35" filter="url(#grain)">
    <!-- Scattered color dots across the scene -->
    <circle cx="300" cy="350" r="3" fill="#FFD700"/>
    <circle cx="420" cy="340" r="2" fill="#FF6347"/>
    <circle cx="500" cy="360" r="3" fill="#9370DB"/>
    <circle cx="160" cy="360" r="2" fill="#FF8C00"/>
    <circle cx="600" cy="345" r="3" fill="#20B2AA"/>
    <circle cx="350" cy="355" r="2" fill="#FF69B4"/>
    <circle cx="480" cy="370" r="3" fill="#4169E1"/>
    <circle cx="240" cy="365" r="2" fill="#32CD32"/>
    <circle cx="700" cy="355" r="3" fill="#FF4500"/>
    <circle cx="100" cy="370" r="2" fill="#DA70D6"/>
  </g>

  <!-- Frame effect - subtle vignette -->
  <rect x="0" y="0" width="800" height="600" fill="none" stroke="#2C1810" stroke-width="8" rx="4"/>

  <!-- Title label -->
  <rect x="20" y="555" width="340" height="30" rx="3" fill="#1C1208" opacity="0.75"/>
  <text x="30" y="574" font-family="Georgia, serif" font-size="13" fill="#F5DEB3" letter-spacing="0.5">
    Georges Seurat — Un dimanche après-midi, 1886
  </text>
</svg>
